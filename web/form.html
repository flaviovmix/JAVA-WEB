<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>

    <!-- Fonte Inter (mais confiável que @import) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="./assets/css/base.css">
    <link rel="stylesheet" href="./assets/css/layout.css">
    <link rel="stylesheet" href="./assets/components/table/style.css">
    <link rel="stylesheet" href="./assets/components/box-detalhe.css">
    <link rel="stylesheet" href="./assets/components/buttons-links/style.css">
    <link rel="stylesheet" href="./assets/components/mini-form.css">


</head>

<body>
    <header class="detalhe-header">
        <div class="header-inner">
            <div class="btn-header">
                <button class="link-voltar" href="tarefas.html">
                    <i class="fa-solid fa-arrow-left"></i>
                    Voltar
                </button>

                <button class="link-add" type="button" onclick="alert('editar (abrir modal)')">
                    <i class="fa-solid fa-plus"></i>
                    Nova
                </button>

                <button class="link-edit" type="button" onclick="alert('editar (abrir modal)')">
                    <i class="fa-solid fa-pen"></i>
                    Editar
                </button>

                <button class="link-apagar" type="button" onclick="alert('excluir')">
                    <i class="fa-solid fa-trash"></i>
                    Excluir
                </button>

                <button class="link-listar" href="#sub-header">
                    <i class="fa-solid fa-list"></i>
                    Lista de subtarefas
                </button>
            </div>

            <h2>JAVA WEB</h2>
        </div>
    </header>

    <main>

        <div class="page-header">

            <div class="sub-header listagem" id="sub-header">
                <h2 class="titulo-secao" onclick="toggleSubtarefas('sectionComp', 'iconeSectionComp')"
                    style="cursor:pointer; display:flex; gap:10px; align-items:center;">
                    <i id="iconeSectionComp" class="fa-solid fa-chevron-right"></i>
                    ABRIR SECTION
                </h2>
            </div>

            <div class="legenda-prioridade">
                <span class="legenda-label">níveis de prioridade</span>
                <div class="legenda-badges">
                    <span class="badge baixa">baixa</span>
                    <span class="badge media">média</span>
                    <span class="badge alta">alta</span>
                </div>
            </div>
        </div>

        <div class="sectionComp" id="sectionComp">

            <!-- FORM: adicionar subtarefa -->
            <section class="mini-form">

                <!-- HEADER -->
                <div class="mini-form-header">
                    <h3>Titulo da Section</h3>

                    <button type="button" class="btn-close" onclick="fecharSubtarefas('sectionComp', 'iconeSectionComp')">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <!-- FORM -->

                <p>
                    Lorem ipsum dolor sit amet consectetur, adipisicing elit.
                </p>

            </section>
        </div>

        
            <div class="sub-header listagem" id="sub-header">
                <h2 class="titulo-secao" onclick="toggleSubtarefas('sectionTeste', 'iconeSectionTeste')"
                    style="cursor:pointer; display:flex; gap:10px; align-items:center;">
                    <i id="iconeSectionTeste" class="fa-solid fa-chevron-right"></i>
                    ABRIR SECTION
                </h2>
            </div>
        <div class="sectionComp" id="sectionTeste">

            <!-- FORM: adicionar subtarefa -->
            <section class="mini-form">

                <!-- HEADER -->
                <div class="mini-form-header">
                    <h3>Titulo da Section</h3>

                    <button type="button" class="btn-close" onclick="fecharSubtarefas('sectionTeste', 'iconeSectionTeste')">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <!-- FORM -->

                <p>
                    Lorem ipsum dolor sit amet consectetur, adipisicing elit.
                </p>

            </section>
        </div>

    </main>

    <script>

        function toggleSubtarefas(sectionComp, iconeSectionComp) {
            const secao = document.getElementById(sectionComp);
            const icone = document.getElementById(iconeSectionComp);

            const vaiAbrir = !secao.classList.contains("ativo");

            secao.classList.toggle("ativo");

            icone.style.transform = vaiAbrir ? "rotate(90deg)" : "rotate(0deg)";
            icone.style.transition = "transform .2s ease";

            // 👇 SCROLL AUTOMÁTICO
            if (vaiAbrir) {
                setTimeout(() => {
                    secao.scrollIntoView({
                        behavior: "smooth",
                        block: "start"
                    });
                }, 200); // tempo pequeno pra esperar abrir animação
            }
        }

        function fecharSubtarefas(sectionComp, iconeSectionComp) {

            const secao = document.getElementById(sectionComp);
            const icone = document.getElementById(iconeSectionComp);

            // remove abertura
            secao.classList.remove("ativo");

            // volta seta
            icone.style.transform = "rotate(0deg)";

            // 👇 SCROLL PRO TOPO
            document.getElementById("sub-header")
                .scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });
        }

    </script>
</body>

</html>
