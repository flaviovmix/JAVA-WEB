<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="./assets/css/base.css">
    <link rel="stylesheet" href="./assets/css/layout.css">
    <link rel="stylesheet" href="./assets/components/table/style.css">
    <link rel="stylesheet" href="./assets/components/box-detalhe.css">
    <link rel="stylesheet" href="./assets/components/buttons-links/style.css">
    <link rel="stylesheet" href="./assets/components/acordeaoAFX.css">


</head>

<body>
    <header class="detalhe-header">
        <div class="header-inner">
            <div class="btn-header">
                <button class="link-voltar" href="tarefas.html">
                    <i class="fa-solid fa-arrow-left"></i>
                    Voltar
                </button>

                <button class="link-add" type="button" onclick="alert('editar (abrir modal)')">
                    <i class="fa-solid fa-plus"></i>
                    Nova
                </button>

                <button class="link-edit" type="button" onclick="alert('editar (abrir modal)')">
                    <i class="fa-solid fa-pen"></i>
                    Editar
                </button>

                <button class="link-apagar" type="button" onclick="alert('excluir')">
                    <i class="fa-solid fa-trash"></i>
                    Excluir
                </button>

                <button class="link-listar" href="#sub-header">
                    <i class="fa-solid fa-list"></i>
                    Lista de subtarefas
                </button>
            </div>

            <h2>JAVA WEB</h2>
        </div>
    </header>

    <main>

        <div class="acordeaoAFX">
            <div class="sub-header listagem">
                <h2 class="labelAcordeaoAFX"
                    data-alvo="#acordeaoAFXNome"
                    data-icone="#iconeAcordeaoAFXNome"
                    data-texto="#textoAcordeaoAFXNome"
                    data-texto-abrir="ABRIR ACORDEÃO AFX TESTE"
                    data-texto-fechar="FECHAR ACORDEÃO AFX TESTE"
                    onclick="toggleAcordeaoAFX(this)">
                <i id="iconeAcordeaoAFXNome" class="fa-solid fa-chevron-right"></i>
                <span id="textoAcordeaoAFXNome">ABRIR ACORDEÃO AFX TESTE</span>
                </h2>
            </div>

            <div class="acordeaoAFXComp ativo" id="acordeaoAFXNome">
                <div class="mini-form">
                    <div class="mini-form-header">
                        <h3>Titulo do Acordeão</h3>
                        <button type="button" class="btn-close"
                        onclick="toggleAcordeaoAFX(this.closest('.acordeaoAFX').querySelector('.labelAcordeaoAFX'), true)">
                        <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>

                    <p>Lorem ipsum...</p>
                </div>
            </div>
        </div>
        <div class="acordeaoAFX">
            <div class="sub-header listagem">
                <h2 class="labelAcordeaoAFX"
                    data-alvo="#acordeaoAFXNome2"
                    data-icone="#iconeAcordeaoAFXNome2"
                    data-texto="#textoAcordeaoAFXNome2"
                    data-texto-abrir="ABRIR ACORDEÃO AFX NOME 2"
                    data-texto-fechar="FECHAR ACORDEÃO AFX NOME 2"
                    onclick="toggleAcordeaoAFX(this)">
                <i id="iconeAcordeaoAFXNome2" class="fa-solid fa-chevron-right"></i>
                <span id="textoAcordeaoAFXNome2">ABRIR ACORDEÃO AFX NOME 2</span>
                </h2>
            </div>

            <div class="acordeaoAFXComp" id="acordeaoAFXNome2">
                <div class="mini-form">
                    <div class="mini-form-header">
                        <h3>Titulo do Acordeão</h3>
                        <button type="button" class="btn-close"
                        onclick="toggleAcordeaoAFX(this.closest('.acordeaoAFX').querySelector('.labelAcordeaoAFX'), true)">
                        <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>

                    <p>Lorem ipsum...</p>
                </div>
            </div>
        </div>
        

       

    </main>

    <script>
document.addEventListener("DOMContentLoaded", () => {
    // 1. Função que executa a alternância (Toggle)
    const toggleAcordeao = (elTitulo) => {
        const secao = document.querySelector(elTitulo.dataset.alvo);
        const icone = document.querySelector(elTitulo.dataset.icone);
        const texto = document.querySelector(elTitulo.dataset.texto);

        if (!secao || !icone || !texto) return;

        const estaAtivo = secao.classList.toggle("ativo");
        const abrirTxt = elTitulo.dataset.textoAbrir || "ABRIR";
        const fecharTxt = elTitulo.dataset.textoFechar || "FECHAR";

        // Estilização e Texto
        icone.style.transform = estaAtivo ? "rotate(90deg)" : "rotate(0deg)";
        icone.style.transition = "transform .2s ease";
        texto.innerText = estaAtivo ? fecharTxt : abrirTxt;

        // Scroll suave
        const elementoParaScroll = estaAtivo ? secao : elTitulo;
        setTimeout(() => {
            elementoParaScroll.scrollIntoView({ behavior: "smooth", block: "start" });
        }, 100);
    };

    // 2. Delegação de Eventos (Otimizado)
    document.addEventListener("click", (event) => {
        // Se clicou no título do acordeão
        const label = event.target.closest(".labelAcordeaoAFX");
        if (label) {
            toggleAcordeao(label);
            return;
        }

        // Se clicou no botão de fechar (X) dentro do acordeão
        const btnClose = event.target.closest(".btn-close");
        if (btnClose) {
            const acordeaoPai = btnClose.closest(".acordeaoAFX");
            const labelCorrespondente = acordeaoPai.querySelector(".labelAcordeaoAFX");
            toggleAcordeao(labelCorrespondente);
        }
    });

    // 3. Sincronização Inicial
    document.querySelectorAll(".labelAcordeaoAFX").forEach((titulo) => {
        const secao = document.querySelector(titulo.dataset.alvo);
        if (secao && secao.classList.contains("ativo")) {
            // Reutiliza a lógica para setar ícone e texto inicial se já vier 'ativo' do backend/HTML
            const icone = document.querySelector(titulo.dataset.icone);
            const texto = document.querySelector(titulo.dataset.texto);
            if(icone) icone.style.transform = "rotate(90deg)";
            if(texto) texto.innerText = titulo.dataset.textoFechar;
        }
    });
});
    </script>
</body>

</html>
