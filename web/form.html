<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="./assets/css/base.css">
    <link rel="stylesheet" href="./assets/css/layout.css">
    <link rel="stylesheet" href="./assets/components/table/style.css">
    <link rel="stylesheet" href="./assets/components/box-detalhe.css">
    <link rel="stylesheet" href="./assets/components/buttons-links/style.css">
    <link rel="stylesheet" href="./assets/components/acordeaoAFX.css">


</head>

<body>
    <header class="detalhe-header">
        <div class="header-inner">
            <div class="btn-header">
                <button class="link-voltar" href="tarefas.html">
                    <i class="fa-solid fa-arrow-left"></i>
                    Voltar
                </button>

                <button class="link-add" type="button" onclick="alert('editar (abrir modal)')">
                    <i class="fa-solid fa-plus"></i>
                    Nova
                </button>

                <button class="link-edit" type="button" onclick="alert('editar (abrir modal)')">
                    <i class="fa-solid fa-pen"></i>
                    Editar
                </button>

                <button class="link-apagar" type="button" onclick="alert('excluir')">
                    <i class="fa-solid fa-trash"></i>
                    Excluir
                </button>

                <button class="link-listar" href="#sub-header">
                    <i class="fa-solid fa-list"></i>
                    Lista de subtarefas
                </button>
            </div>

            <h2>JAVA WEB</h2>
        </div>
    </header>

    <main>
        <div class="acordeaoAFX">
            <div class="sub-header listagem" id="tituloAcordeaoAFXNome">
                <h2 class="titulo-secao"
                    onclick="toggleAcordeaoAFX('acordeaoAFXNome','iconeAcordeaoAFXNome','textoAcordeaoAFXNome')"
                    style="cursor:pointer; display:flex; gap:10px; align-items:center;">

                    <i id="iconeAcordeaoAFXNome" class="fa-solid fa-chevron-right"></i>
                    <span id="textoAcordeaoAFXNome">FECHAR ACORDEÃO AFX</span>
                </h2>
            </div>

            <div class="acordeaoAFXComp ativo" id="acordeaoAFXNome">
                <div class="mini-form">
                    <div class="mini-form-header">
                        <h3>Titulo do Acordeão</h3>
                        <button type="button" class="btn-close"
                            onclick="fecharAcordeaoAFX('acordeaoAFXNome', 'iconeAcordeaoAFXNome', 'tituloAcordeaoAFXNome', 'textoAcordeaoAFXNome')">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Repudiandae sint nihil necessitatibus.
                        Tempore suscipit mollitia aliquid ducimus quam. Pariatur quia veniam, perferendis facilis
                        officia dicta. Veniam nemo deleniti quod hic?</p>
                </div>
            </div>
        </div>

    </main>

    <script>

        function toggleAcordeaoAFX(idAcordeaoAFX, idIconeAFX, idTextoAFX) {
            const secao = document.getElementById(idAcordeaoAFX);
            const icone = document.getElementById(idIconeAFX);
            const texto = document.getElementById(idTextoAFX);

            const vaiAbrir = !secao.classList.contains("ativo");
            secao.classList.toggle("ativo");

            icone.style.transform = vaiAbrir ? "rotate(90deg)" : "rotate(0deg)";
            icone.style.transition = "transform .2s ease";

            texto.innerText = vaiAbrir ? "FECHAR ACORDEÃO AFX" : "ABRIR ACORDEÃO AFX";

            if (vaiAbrir) {
                setTimeout(() => {
                    secao.scrollIntoView({ behavior: "smooth", block: "start" });
                }, 200);
            }
        }


        function fecharAcordeaoAFX(idAcordeaoAFX, idIconeAFX, idTituloAFX, idTextoAFX) {

            const secao = document.getElementById(idAcordeaoAFX);
            const icone = document.getElementById(idIconeAFX);
            const titulo = document.getElementById(idTituloAFX);
            const texto = document.getElementById(idTextoAFX);

            secao.classList.remove("ativo");
            icone.style.transform = "rotate(0deg)";
            texto.innerText = "ABRIR ACORDEÃO AFX";

            titulo.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });
        }

    </script>
</body>

</html>
